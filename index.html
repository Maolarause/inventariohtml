<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion Inventario ADSO</title>
    <!--CSS de Bootstrap 5.3.3 desde url prederteminada -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Libreria de iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados-->
</head>
<body class="login-fondo">

    <main class="login-card"><!--contenido  principal de la pagina-->
        <header class="login-encabezado"><!--encabezado del login-->
            <!--Icono de la tienda -->
            <i class="bi bi-shop display-4 text-sena"></i>
            <h1 class="h3 fw-bold">Inventario Sena</h1>
            <p class="text-secondary mb-0">Ingresa tus credenciales para continuar</p>
        </header>


        <form action="dashboard.html" method="get"> <!--Form permite crear el contenido de un formulario cuando se envia nos lleva a la ruta method nos envia la informacion con get-->
            <div class="form-floating mb-3"><!--Agrupar un contenido en un contenedor-->
                
                <input type="email" class="form-control" id="correo" placeholder="sena@correo.com" required><!--type obliga que tenga el @, placeholder el texto de ejemplo required es q es un campo obligatorio-->
                <label for="correo"><i class="bi bi-envelope me-1"></i>Correo Electronico</label><!--ES una tiqueda de texto que con el for conecta con el input-->
            </div>
            <div class="form-floating mb-3">                
                <input type="password" class="form-control" id="clave" placeholder="Minimo 6 caracteres" minlength="6" required><!--type=password oculta loque escribes, minlength=6 exige al menos 6 caracteres-->
                <label for="clave"><i class="bi bi-lock me-1"></i>Contraseña</label>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                <input class="form-check-input" type="checkbox" id="recordar"><!--type checkbox es casilla de verificacion-->
                <label class="form-check-label" for="recordar">Recordarme</label>
            </div>
            <a href="#" class="small text-decoration-none">Olvido su contraseña ?</a>
        </div>

            <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
            </button><!--envia el formulario antes revisa los campos required email y minlengt-->
        </form><!--Cierra el fomulario-->

        <p class="login-pie">¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Registrate</a></p>
        <footer class="login-pie"> 2026 SENA - ADSO Mixto</footer><!--pie de pagina -->
    </main>
    
</body>
</html>
